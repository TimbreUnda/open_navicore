name: Feature request
description: Propose a scoped backend, tooling, or compatibility improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the API, behavior, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and tests
      description: Identify supporting ABI evidence and the tests that should change.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require distributing proprietary firmware, SDK files, keys, or map data.
          required: true
